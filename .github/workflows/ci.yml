name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests (server, agent, reviewed fix steps)
        run: python -m unittest discover -s tests -v
      - name: Agent dry run on this OS
        run: python agent.py --dry-run --quiet --no-network
